version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: grapes_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: grapes_db
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - "3307:3306"
    volumes:
      - grapes_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build: .
    container_name: grapes_php_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

volumes:
  grapes_db_data:
